server:
  port: -1

spring:
  datasource:
    sqlserver:
      url: jdbc:h2:mem:test_sqlserver_db;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: TestSqlServerPool

    db2:
      url: jdbc:h2:mem:test_db2_db;DB_CLOSE_DELAY=-1;MODE=DB2
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: TestDb2Pool

  jpa:
    open-in-view: false
    sqlserver:
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.H2Dialect
          format_sql: true

    db2:
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.H2Dialect
          format_sql: true
