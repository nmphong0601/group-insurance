# Local profile for standalone development without requiring active external SQL Server / DB2 instances
spring:
  datasource:
    sqlserver:
      jndi-name: java:comp/env/jdbc/SqlServerDb
      url: jdbc:h2:mem:sqlserver_proposal_db;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: LocalH2SqlServerPool
        maximum-pool-size: 5

    db2:
      jndi-name: java:comp/env/jdbc/Db2Db
      url: jdbc:h2:mem:db2_policy_db;DB_CLOSE_DELAY=-1;MODE=DB2
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: LocalH2Db2Pool
        maximum-pool-size: 5

  jpa:
    sqlserver:
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.H2Dialect
          format_sql: true

    db2:
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.H2Dialect
          format_sql: true
