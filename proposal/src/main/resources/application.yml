server:
  port: 8081
  servlet:
    context-path: /proposal-service

spring:
  application:
    name: proposal-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # =====================================================================
  # Multiple Datasources Configuration
  # =====================================================================
  datasource:
    # Primary Datasource: Microsoft SQL Server (Proposal DB)
    sqlserver:
      url: ${SQLSERVER_URL:jdbc:sqlserver://localhost:1433;databaseName=ProposalDb;encrypt=false;trustServerCertificate=true}
      username: ${SQLSERVER_USERNAME:sa}
      password: ${SQLSERVER_PASSWORD:YourStrong@Passw0rd}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: SqlServerHikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        idle-timeout: 300000
        connection-timeout: 30000
        initialization-fail-timeout: -1

    # Secondary Datasource: IBM DB2 (Legacy Policy DB)
    db2:
      url: ${DB2_URL:jdbc:db2://localhost:50000/POLICYDB}
      username: ${DB2_USERNAME:db2inst1}
      password: ${DB2_PASSWORD:db2password}
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: Db2HikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        idle-timeout: 300000
        connection-timeout: 30000
        initialization-fail-timeout: -1

  # =====================================================================
  # JPA & Hibernate Configuration
  # =====================================================================
  jpa:
    open-in-view: false
    # SQL Server JPA Settings
    sqlserver:
      hibernate:
        ddl-auto: ${SQLSERVER_DDL_AUTO:update}
      show-sql: ${SQLSERVER_SHOW_SQL:true}
      properties:
        hibernate:
          dialect: org.hibernate.dialect.SQLServerDialect
          format_sql: true

    # IBM DB2 JPA Settings
    db2:
      hibernate:
        ddl-auto: ${DB2_DDL_AUTO:none}
      show-sql: ${DB2_SHOW_SQL:true}
      properties:
        hibernate:
          dialect: org.hibernate.dialect.DB2Dialect
          format_sql: true

logging:
  level:
    root: INFO
    vn.com.group.insurance: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
